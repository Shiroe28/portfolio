<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sam Richmond Go | Certificates</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans&family=Varela+Round&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>

  <link rel="stylesheet" href="portfolio.css" />
  <link rel="stylesheet" href="firstpage.css" />

  <style>
    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
    }

    .modal-content {
      position: relative;
      margin: 5% auto;
      width: 90%;
      max-width: 800px;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      position: relative;
    }

    .modal-title {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
    }

    .close-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: white;
      font-size: 30px;
      cursor: pointer;
      padding: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s;
    }

    .close-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .modal-body {
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #certificateImage {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 0 0 12px 12px;
    }

    @media (max-width: 768px) {
      .modal-content {
        margin: 10% auto;
        width: 95%;
      }
      
      .modal-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body class="min-h-screen m-0 py-8 px-4 text-center font-sans relative overflow-y-auto">

  <div id="vanta-bg"></div>

 
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" style="text-decoration: none; color: inherit;">SRG</a>
      <div class="nav-links">
        <a href="about-me.html" class="nav-link">About Me</a>
        <a href="tech-stack.html" class="nav-link">Tech Stack</a>
        <a href="certificates.html" class="nav-link">Certificates</a>
        <a href="projects.html" class="nav-link">Projects</a>
        <a href="blog.html" class="nav-link">Contact</a>
      </div>
    </div>
  </nav>

  <div class="flex justify-center items-start min-h-screen" style="padding-top: 100px;">
    <div class="bg-white/95 p-6 rounded-2xl shadow-2xl max-w-4xl w-full z-10 backdrop-blur-sm my-8">
      <h2 class="text-3xl font-bold mb-3 text-gray-800">Certificates</h2>
      <p class="text-gray-600 mb-6 text-base">Professional certifications and achievements</p>

      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
        
       
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200 hover:shadow-xl transition-all duration-300">
          <div class="mb-4">
            <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-3">
              <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-2">Certificate of Participation</h3>
            <p class="text-sm text-gray-600 mb-1">Domini Xode's 2023 Code Hunt Event</p>
            <p class="text-sm text-gray-600 mb-2">Issued by: Dominixode</p>
            <p class="text-xs text-gray-500">Date: Oct 28, 2023</p>
          </div>
          <button onclick="openModal()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-2 px-4 rounded-lg hover:from-blue-700 hover:to-purple-700 transition-all duration-300">
            View Certificate
          </button>
        </div>

      </div>
    </div>
  </div>

  
  <div id="certificateModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Certificate of Participation</h2>
        <span class="close" onclick="closeModal()">&times;</span>
      </div>
      <div class="modal-body">
        <img id="certificateImage" src="CJ Group.png" alt="Domini Xode Certificate" />
      </div>
    </div>
  </div>

  <script>
    VANTA.FOG({
      el: "#vanta-bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: 0x0,
      midtoneColor: 0x0,
      lowlightColor: 0x0,
      baseColor: 0xffffff
    });

    function openModal() {
      const modal = document.getElementById('certificateModal');
      const certificateImage = document.getElementById('certificateImage');
      
      certificateImage.src = 'CJ Group.png';
      
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('certificateModal');
      modal.style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('certificateModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') {
        closeModal();
      }
    });
  </script>

</body>
</html>
