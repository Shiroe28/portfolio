<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  
  <title>Sam Richmond Go | Home Page</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Varela+Round&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="firstpage.css"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Lilita One', cursive;
    }

    #vanta-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .container {
      position: relative;
      z-index: 1;
    }

    .profile-pic,
    .btn {
      transition: transform 0.3s ease, opacity 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="vanta-bg"></div>

  
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo" style="text-decoration: none; color: inherit;">SRG</a>
      <div class="nav-links">
        <a href="about-me.html" class="nav-link">About Me</a>
        <a href="tech-stack.html" class="nav-link">Tech Stack</a>
        <a href="certificates.html" class="nav-link">Certificates</a>
        <a href="projects.html" class="nav-link">Projects</a>
        <a href="blog.html" class="nav-link">Contact</a>
      </div>
    </div>
  </nav>

  
  <main class="main-content">
    <div class="hero-section">
      <img class="profile-pic" src="sam.jpg" alt="Profile Image"/>
      <h1 class="hero-title">Sam Richmond Go</h1>
      <p class="hero-description">Designing with purpose, coding with precision, and creating with passion.</p>
    </div>
  </main>

  <script>
    VANTA.FOG({
      el: "#vanta-bg", 
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      highlightColor: 0x0,
      midtoneColor: 0x0,
      lowlightColor: 0x0,
      baseColor: 0xffffff
    });
  </script>

  <script src="firstpage.js"></script>
</body>
</html>
